  max_files_changed: 2
  allowed_paths:
    - src/click/core.py
    - tests/test_defaults.py
  forbidden_paths:
    - CHANGES.rst
    - docs/
    - docs/conf.py
    - pyproject.toml
    - setup.cfg
    - setup.py
    - tox.ini
    - noxfile.py
    - requirements/
    - requirements*.txt
    - Pipfile
    - poetry.lock
    - uv.lock
    - "*.lock"
    - build/
    - dist/
    - htmlcov/
    - .pytest_cache/
    - src/click/_vendor/
    - tests/conftest.py
    - tests/test_options.py
    - tests/test_parser.py
    - tests/test_types.py
