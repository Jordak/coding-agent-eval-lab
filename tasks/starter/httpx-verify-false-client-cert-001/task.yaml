id: httpx-verify-false-client-cert-001
title: HTTPX should keep client certs with verify disabled
repo: https://github.com/encode/httpx.git
commit: 0cb7e5a2e736628e2f506d259fcf0d48cd2bde82
language: python
suite: starter-coding
eval_type: regression
prompt: >
  A user doing a local mTLS smoke test reports that HTTPX behaves oddly when
  they pass both verify=False and a client certificate. They are intentionally
  skipping server certificate verification for a local or self-signed endpoint,
  but they still expect the client certificate to be configured. Make the
  conservative compatibility choice: verify=False should disable server
  certificate checks only, not ignore client-side certs. Keep the existing
  verify=True with cert behavior and verify=False without cert behavior intact.
  This v1 task is non-interactive, so proceed with that assumption.
reference_solution: >
  In create_ssl_context, make the verify=False branch assign the unverified SSL
  context to the same ctx variable used by the other branches, then allow the
  existing cert-loading block to run before returning the context. Human review
  should accept a focused patch that preserves verify=False as
  CERT_NONE/check_hostname=False, loads string and tuple client certificates
  through the existing cert path, and does not broaden unrelated SSL or request
  behavior.
reference_artifact:
  type: patch
  path: reference.patch
hidden_verifier:
  patch: verifier.patch
  commands:
    - python .agentlab_hidden/check_behavior.py
setup:
  - python3 -m venv .agentlab/venv
  - python -m pip install --upgrade pip
  - python -m pip install -e . "pytest<9"
environment_path:
  - .agentlab/venv/bin
environment:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_ADDOPTS: "-p no:cacheprovider"
  VIRTUAL_ENV: "{workspace}/.agentlab/venv"
baseline:
  - >-
    python -c 'import ssl, httpx; calls = []; ssl.SSLContext.load_cert_chain = lambda self, *args, **kwargs: calls.append(args); ctx = httpx.create_ssl_context(verify=False, cert=("client.pem", "client.key")); assert ctx.verify_mode == ssl.CERT_NONE, ctx.verify_mode; assert ctx.check_hostname is False, ctx.check_hostname; assert calls == [], calls'
success:
  tests_must_pass: true
  max_files_changed: 2
tags:
  - bugfix
  - python
  - ssl
  - client-cert
  - ambiguous-behavior
  - real-pr
failure_modes:
  - context_miss
  - spec_misread
  - bad_local_fix
  - test_gap
  - over_edit
  - resource_inefficient
