id: 2048-advanced-snake-params-001
title: Advanced-snake simulations should persist custom weights
repo: https://github.com/Jordak/2048-game.git
commit: aec81a17d78a60f1f69d64aade4c108423d1f97e
language: python
suite: starter-coding
eval_type: capability
prompt: >
  Fix the simulation metadata bug where trials using the advanced-snake heuristic
  do not persist their custom heuristic weights in the result payload. The CLI
  exposes this heuristic as advanced-snake, so a simulation with custom weights
  should return those weights in the params field and preserve the trial tag.
reference_solution: >
  In simulation.py, persist params when args.heuristic is advanced-snake instead
  of the obsolete advanced name; a focused solution changes only that condition
  and may optionally update stale tests to match the renamed heuristic.
reference_artifact:
  type: patch
  path: reference.patch
hidden_verifier:
  patch: verifier.patch
  commands:
    - python3 .agentlab_hidden/check_behavior.py
setup:
  - python3 -c "import numpy"
environment:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_ADDOPTS: "-p no:cacheprovider"
baseline:
  - python3 -c "from game import Game; game = Game(); assert game.board.shape == (4, 4); assert not game.game_over()"
success:
  tests_must_pass: true
  max_files_changed: 3
tags:
  - bugfix
  - python
  - simulation
  - metadata
  - real-failure
failure_modes:
  - context_miss
  - spec_misread
  - bad_local_fix
  - test_gap
  - over_edit
  - tool_misuse
