id: click-should-strip-ansi-tests-001
title: Click should cover should_strip_ansi color and stream behavior
repo: https://github.com/pallets/click.git
commit: 8bd8b4a074c55c03b6eb5666edc44a9c43df38a2
language: python
suite: starter-coding
eval_type: regression
prompt: >
  Add focused tests for Click's existing `_compat.should_strip_ansi` behavior.
  Cover the explicit color override cases where `color=True` keeps ANSI and
  `color=False` strips ANSI, plus the automatic `color=None` decisions for TTY
  streams, Jupyter kernel output, and non-TTY/non-Jupyter streams. Include common
  stream inputs such as `None`, stdin, stdout, and stderr. This is a
  test-writing task only: do not modify production code, docs, packaging, or
  configuration. Keep the tests in the existing compat tests.
reference_solution: >
  Update `tests/test_compat.py` to import Click, pytest, and sys; test
  `_is_jupyter_kernel_output` directly; and add a parametrized
  `test_should_strip_ansi` that monkeypatches `click._compat.isatty` and
  `click._compat._is_jupyter_kernel_output` before asserting
  `click._compat.should_strip_ansi(stream=..., color=...)` for color overrides
  and automatic terminal/Jupyter cases.
reference_artifact:
  type: patch
  path: reference.patch
hidden_verifier:
  patch: verifier.patch
  commands:
    - python .agentlab_hidden/check_test_mutations.py
setup:
  - PYENV_VERSION=3.13.5 python3.13 -m venv .agentlab/venv
  - python -m pip install -e . "pytest<9"
environment_path:
  - .agentlab/venv/bin
environment:
  PYTHONPATH: "{workspace}/src"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_ADDOPTS: "-p no:cacheprovider"
  VIRTUAL_ENV: "{workspace}/.agentlab/venv"
baseline:
  - >-
    python -c 'import click, sys; compat = click._compat; compat.isatty = lambda stream: True; compat._is_jupyter_kernel_output = lambda stream: False; assert compat.should_strip_ansi(stream=sys.stdout, color=None) is False; assert compat.should_strip_ansi(stream=sys.stdout, color=True) is False; assert compat.should_strip_ansi(stream=sys.stdout, color=False) is True; compat.isatty = lambda stream: False; compat._is_jupyter_kernel_output = lambda stream: True; assert compat.should_strip_ansi(stream=None, color=None) is False; compat._is_jupyter_kernel_output = lambda stream: False; assert compat.should_strip_ansi(stream=None, color=None) is True'
  - python -c 'from pathlib import Path; text = Path("tests/test_compat.py").read_text(); assert "def test_should_strip_ansi" not in text'
test:
  - python -m pytest tests/test_compat.py -q
success:
  tests_must_pass: true
  max_files_changed: 1
tags:
  - test-writing
  - python
  - cli
  - compat
  - real-pr
failure_modes:
  - context_miss
  - spec_misread
  - test_gap
  - over_edit
  - resource_inefficient
  - tool_misuse
